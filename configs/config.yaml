# Project configuration. Values here override the defaults in src/config.py.

model:
  name: TinyLlama/TinyLlama-1.1B-Chat-v1.0
  # float32 keeps partitioned outputs token-identical to model.generate().
  # bfloat16 halves RAM (~2.2 GB instead of ~4.4 GB) but changes outputs slightly.
  dtype: float32

# Each strategy is a real execution configuration: a layer split plus an
# intra-op thread budget per stage, expressed as a fraction of physical cores.
strategies:
  static:
    layer_ranges: [[0, 21]]
    thread_fractions: [1.0]
  balanced:
    layer_ranges: [[0, 10], [11, 21]]
    thread_fractions: [0.3, 0.3]
  latency_optimized:
    layer_ranges: [[0, 21]]
    thread_fractions: [0.6]

# Two separate emergency mechanisms, both OFF by default:
# - latency switch (engine, --emergency-latency-factor): if a token takes more than
#   `factor` x the median of the last 10 tokens, the next token runs on
#   `conservative_arm`. Only allowed with an adaptive scheduler.
# - CPU emergency (scheduler, --emergency-cpu): external CPU % at a decision point
#   that bypasses the policy's hysteresis. Set per run on the command line.
emergency_latency_switch:
  enabled: false
  factor: 3.0
  conservative_arm: balanced
